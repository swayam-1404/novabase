[package]
name = "nova-studio"
version = "0.1.0"
description = "Native NovaQL workspace for NovaDB"
edition = "2021"
license = "MIT"
rust-version = "1.85"
publish = false

[lib]
name = "nova_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nova-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
nova-client = { path = "../../../crates/nova-client", version = "0.1.0" }
nova-core = { path = "../../../crates/nova-core", version = "0.1.0" }
nova-executor = { path = "../../../crates/nova-executor", version = "0.1.0" }
nova-server = { path = "../../../crates/nova-server", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.6", features = [] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
