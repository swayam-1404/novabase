[workspace]
resolver = "2"
members = [
    "crates/nova-core",
    "crates/nova-nbf",
    "crates/nova-storage",
    "crates/nova-buffer",
    "crates/nova-wal",
    "crates/nova-index",
    "crates/nova-query",
    "crates/nova-planner",
    "crates/nova-executor",
    "crates/nova-transaction",
    "crates/nova-intelligence",
    "crates/nova-auth",
    "crates/nova-server",
    "crates/nova-client",
    "cli/nova-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["Swayam <swaya@users.noreply.github.com>"]

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"